<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clarisse</title>
  <link rel="preload" href="/static/fontes/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/estilo.css">
  <script src="/static/nucleo.js" defer></script>
  <script src="/static/cartoes.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body data-estado="idle">
  <canvas id="nucleo" aria-hidden="true"></canvas>

  <header class="topo">
    <div class="marca">CLARISSE</div>
    <p id="estado" class="estado" role="status" aria-live="polite"></p>
  </header>
  <div class="canto">LOCAL · GEMMA</div>
  <div class="hora" id="hora"></div>
  <p class="voce" id="voce"></p>

  <div class="palco-cartao" id="palco-cartao"></div>
  <p class="legenda" id="legenda" aria-live="polite"></p>
  <div class="fileira" id="fileira" aria-label="Respostas anteriores"></div>

  <p id="aviso-som" class="aviso-som" hidden>Clique em qualquer lugar da página para liberar o som.</p>

  <button type="button" id="falar" class="botao-falar" aria-pressed="false">
    <span class="falar-ponto" aria-hidden="true"></span>
    <span id="falar-rotulo">Insert para falar</span>
  </button>

  <button type="button" id="escrever" class="botao-escrever" aria-expanded="false" aria-controls="chat">✎ Escrever</button>

  <aside class="chat" id="chat" aria-label="Escrever para a Clarisse">
    <div class="chat-topo">
      <span>CONVERSA</span>
      <button type="button" id="fechar-chat" class="chat-fechar" aria-label="Fechar a escrita">×</button>
    </div>
    <section class="conversa" id="conversa" role="log" aria-live="polite" aria-label="Conversa">
      <p class="conversa-vazia" id="conversa-vazia">A conversa por voz também aparece aqui.</p>
    </section>
    <div id="confirmacao" class="confirmacao" hidden>
      <button type="button" id="confirmar" class="botao botao-sim">Confirmar</button>
      <button type="button" id="cancelar" class="botao botao-nao">Cancelar</button>
    </div>
    <form id="formulario" class="escrever" autocomplete="off">
      <label for="texto" class="apenas-leitor">Escrever para a Clarisse</label>
      <input id="texto" name="texto" maxlength="2000" placeholder="Escreva e aperte Enter">
      <p class="dica">A voz continua ligada. Feche aqui para voltar só à voz.</p>
    </form>
  </aside>
</body>
</html>
