name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A Clarisse roda só no Windows (desde 05/10/2026); os outros jobs não dependem do sistema.
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest

  dependencias:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # As versões já vêm travadas pelo uv.lock: o pip-audit só consulta, sem refazer a resolução (o PyTorch
      # de CPU não está no PyPI). O "+cpu" sai para o PyTorch também ser consultado: é o mesmo código.
      - run: uv export --format requirements-txt --no-hashes --no-dev --frozen | sed 's/+cpu//' > requisitos.txt
      - run: uvx pip-audit -r requisitos.txt --disable-pip --no-deps

  segredos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact
