[project]
name = "clarisse"
version = "0.1.0"
description = "Assistente de voz local que conversa, executa ações na máquina e delega ao Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "kokoro>=0.9.4",
    "mcp>=2.3.0",
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pydantic-settings>=2.15.0",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2",
    "pywinauto>=0.6.9",
    "soundfile>=0.13",
    "torch>=2.6",
    # Sem este piso o resolvedor cai num transformers de 2021 que precisa compilar Rust.
    "transformers>=4.40",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Aviso informativo do pywinauto ao achar o COM já ligado pelo pycaw; o modo final é o certo.
filterwarnings = ["ignore:Revert to STA COM threading mode:UserWarning:pywinauto"]

[tool.uv]
package = false

# A voz roda no processador: o PyTorch só de CPU baixa ~200 MB em vez de ~2 GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
